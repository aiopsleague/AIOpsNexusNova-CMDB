# =============================================================================
# CMDB — Production Docker Compose
# =============================================================================
# 与 docker-compose-dev.yml 共用数据卷（db-data / cache-data），两套不能同时运行。
#
# 快速开始:
#   1. cp .env.example .env && vim .env          # 修改密码和密钥
#   2. docker compose up -d                       # 启动所有服务
#   3. docker compose logs -f cmdb-api            # 观察 API 初始化日志
#   4. 浏览器打开 http://<host>:${NGINX_PORT:-80}
#
# 管理:
#   docker compose down                           # 停止（保留数据）
#   docker compose down -v                        # 停止并删除数据卷
#   docker compose restart cmdb-api               # 重启 API
#   docker compose exec cmdb-api python cli.py --help  # 管理命令
#
# 架构:
#   nginx (:80) -> Vue SPA (静态文件)
#               -> /api -> FastAPI (:5000, 内部)
#   FastAPI     -> MySQL (:3306, 内部)
#               -> Redis (:6379, 内部)
#   Celery Worker + Beat -> Redis (broker/result)
# =============================================================================

# ---- Reusable anchors ---------------------------------------------------------
x-common-env: &common-env
  TZ: Asia/Shanghai
  SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: "${MYSQL_USER:-cmdb}"
  MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
  MYSQL_DATABASE: "${MYSQL_DATABASE:-cmdb}"
  CACHE_REDIS_HOST: redis
  CACHE_REDIS_PORT: 6379
  CELERY_BROKER_URL: redis://redis:6379/2
  CELERY_RESULT_BACKEND: redis://redis:6379/2

x-healthy-deps: &healthy-deps
  cmdb-db:
    condition: service_healthy
  cmdb-cache:
    condition: service_healthy

# ---- Services -----------------------------------------------------------------
services:

  # ===== MySQL 8.0 =============================================================
  cmdb-db:
    image: mysql:8.0.42
    container_name: cmdb-db
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-cmdb}"
      MYSQL_USER: "${MYSQL_USER:-cmdb}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
    volumes:
      - db-data:/var/lib/mysql
      - ./docs/mysqld.cnf:/etc/mysql/conf.d/mysqld.cnf:ro
      - ./docs/cmdb.sql:/docker-entrypoint-initdb.d/cmdb.sql:ro
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -p$$MYSQL_ROOT_PASSWORD
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      cmdb-network:
        aliases:
          - mysql
    # 生产环境不暴露数据库端口到宿主机，如需外部访问请取消注释:
    # ports:
    #   - '23306:3306'
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  # ===== Redis 6.2 =============================================================
  cmdb-cache:
    image: redis:6.2
    container_name: cmdb-cache
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      cmdb-network:
        aliases:
          - redis
    # 生产环境不暴露 Redis 端口到宿主机，如需外部访问请取消注释:
    # ports:
    #   - '6379:6379'
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 30m
        max-file: "3"

  # ===== FastAPI (Backend) =====================================================
  cmdb-api:
    image: "${CMDB_API_IMAGE:-cmdb-api:latest}"
    container_name: cmdb-api
    restart: unless-stopped
    environment: *common-env
    depends_on: *healthy-deps
    networks:
      - cmdb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    command:
      - /bin/sh
      - -c
      - |
        echo "=== CMDB API — Running init commands ==="
        python cli.py db-setup
        python cli.py common-check-new-columns
        python cli.py cmdb-init-cache
        python cli.py cmdb-init-acl
        python cli.py init-import-user-from-acl
        python cli.py init-department
        echo "=== Starting uvicorn on :5000 ==="
        exec uvicorn main:app \
          --host 0.0.0.0 \
          --port 5000 \
          --proxy-headers \
          --forwarded-allow-ips='*' \
          --no-access-log

  # ===== Celery Worker =========================================================
  cmdb-worker:
    image: "${CMDB_API_IMAGE:-cmdb-api:latest}"
    container_name: cmdb-worker
    restart: unless-stopped
    environment: *common-env
    depends_on: *healthy-deps
    networks:
      - cmdb-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    command: >
      celery -A celery_worker.celery worker
      -E
      -Q one_cmdb_async,acl_async
      --loglevel=warning
      --concurrency=4

  # ===== Celery Beat (定时调度) ================================================
  cmdb-beat:
    image: "${CMDB_API_IMAGE:-cmdb-api:latest}"
    container_name: cmdb-beat
    restart: unless-stopped
    environment: *common-env
    depends_on: *healthy-deps
    networks:
      - cmdb-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    command: >
      celery -A celery_worker.celery beat
      --loglevel=warning

  # ===== Nginx + Vue SPA (Frontend) ============================================
  cmdb-ui:
    image: "${CMDB_UI_IMAGE:-cmdb-ui:latest}"
    container_name: cmdb-ui
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      cmdb-api:
        condition: service_healthy
    networks:
      - cmdb-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 30m
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# ---- Named Volumes ------------------------------------------------------------
volumes:
  db-data:
    driver: local
    name: cmdb_db-data
  cache-data:
    driver: local
    name: cmdb_cache-data

# ---- Network ------------------------------------------------------------------
networks:
  cmdb-network:
    driver: bridge
    name: cmdb_network
