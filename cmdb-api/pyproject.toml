[project]
name = "cmdb-api-fastapi"
version = "0.1.0"
description = "CMDB API - FastAPI rewrite of the legacy Flask application"
readme = "PORTING.md"
requires-python = ">=3.12"
dependencies = [
    # FastAPI
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=1.10",
    # Database
    "sqlalchemy==1.4.49",
    "pymysql==1.1.0",
    "redis==4.6.0",
    "python-redis-lock==4.0.0",
    # Migrations
    "alembic==1.7.7",
    # Deployment
    "supervisor==4.0.3",
    # Auth
    "bcrypt>=3.2",
    "itsdangerous==2.1.2",
    "ldap3==2.9.1",
    "pycryptodome==3.12.0",
    "cryptography>=41.0.2",
    # Environment variable parsing
    "environs==4.2.0",
    "marshmallow==2.20.2",
    # Async tasks
    "celery==5.3.1",
    "celery-once==3.0.1",
    "more-itertools==5.0.0",
    "kombu>=5.3.1",
    # Common settings
    "timeout-decorator==0.5.0",
    "wtforms==3.0.0",
    "email-validator>=2.0",
    "treelib==1.6.1",
    "pillow>=10.0.1",
    # Other
    "six==1.16.0",
    "bs4>=0.0.1",
    "toposort>=1.5",
    "requests>=2.22.0",
    "requests-oauthlib==1.3.1",
    "markdownify==0.11.6",
    "pyjwt==2.4.0",
    "elasticsearch==7.17.9",
    "future==0.18.3",
    "jinja2==3.1.2",
    "jinja2schema==0.1.4",
    "msgpack-python==0.5.6",
    "hvac==2.0.0",
    "colorama>=0.4.6",
    "pycryptodomex>=3.19.0",
    "lz4>=4.3.2",
    "python-magic==0.4.27",
    "jsonpath==0.82.2",
    "networkx>=3.1",
    "ipaddress>=1.0.23",
    "click>=8.0",
    "python-multipart>=0.0.9",
    "babel>=2.12",
    "setuptools>=83.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
    "factory-boy>=2.12,<2.13",
    "ruff>=0.4",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
