# Local development override:
# - build/run from the current source tree instead of the released images
# - expose Redis on the host so the FastAPI backend can be tested from the host
# - run cmdb-api in UTC: with TZ=Asia/Shanghai the JWT iat (datetime.now()
#   serialized as UTC) lands 8h in the future and every Access-Token request
#   fails with "The token is not yet valid (iat)".
services:
  cmdb-cache:
    ports:
      - "6379:6379"
  cmdb-api:
    image: cmdb-api:local
    environment:
      TZ: UTC
  cmdb-ui:
    image: cmdb-ui:local
